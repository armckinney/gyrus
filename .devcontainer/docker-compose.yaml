services:
  devcontainer:
    build:
      dockerfile: .devcontainer/Dockerfile
      context: ..
    volumes:
      - ..:/workspaces/gyrus:cached
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    command: sleep infinity

  postgres:
    image: postgres:16-alpine
    container_name: gyrus-postgres
    restart: always
    profiles:
      - testing
      - sidecars
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gyrus
    ports:
      - "5432:5432"
    volumes:
      - gyrus-postgres-data:/var/lib/postgresql/data

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: gyrus-ollama
    restart: always
    profiles:
      - testing
      - sidecars
    ports:
      - "11434:11434"
    volumes:
      - gyrus-ollama-data:/root/.ollama

volumes:
  gyrus-postgres-data:
  gyrus-ollama-data:
